name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          skip-cache: false
          skip-pkg-cache: false
          skip-build-cache: false

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: Build
        run: make build
